openapi: 3.0.3
info:
  title: Card Management API
  version: 1.0.0
  description: |
    REST API used by The Bank mobile app to view cards, block and unblock them,
    reissue a card and respond to anti-fraud blocks.

    Part of the [card management case study](../README.md). Every operation
    references the use case it implements.

    ## Conventions

    - **Authentication.** Every request carries the customer's access token
      (`Authorization: Bearer ...`). The customer ID is taken from the token,
      never from the request.
    - **Idempotency.** Every state-changing request (`POST`) requires an
      `Idempotency-Key` header with a UUID generated by the app. Repeating a
      request with the same key returns the stored result of the first one.
      Keys are stored for 24 hours.
    - **Step-up authentication.** Sensitive actions (unblock, confirming a
      suspicious transaction) require an `X-Step-Up-Token` issued by the Auth
      Service after OTP or biometric confirmation. The token is short-lived and
      bound to the customer, the card and the action.
    - **Errors** follow RFC 7807 (`application/problem+json`) with an
      additional machine-readable `code`.
    - **Card numbers** are only ever returned in masked form.
    - **Asynchronous operations.** When the processing center does not respond
      in time, state-changing card operations return `202 Accepted` with an
      operation to poll at `GET /operations/{operationId}`.
  contact:
    name: Alina Vlasova

servers:
  - url: https://api.thebank.example/mobile/v1
    description: Fictional production server

tags:
  - name: Cards
    description: Card list and card details (UC-01)
  - name: Card Status
    description: Temporary block, unblock and permanent block (UC-02, UC-03, UC-04)
  - name: Operations
    description: Status of asynchronous operations (UC-02 ext. 6a, UC-04 ext. 8a)
  - name: Reissue
    description: Card reissue (UC-05)
  - name: Fraud Cases
    description: Review of suspicious transactions (UC-07)

security:
  - bearerAuth: []

paths:
  /cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: List the customer's cards
      description: |
        **UC-01.** Returns all cards of the customer, including closed cards for
        12 months after closing (BR-01-2). Available actions are calculated by
        the server from the card status (BR-01-3).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Customer's cards
          content:
            application/json:
              schema:
                type: object
                required: [cards]
                properties:
                  cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
              examples:
                mixedStatuses:
                  $ref: '#/components/examples/CardList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /cards/{cardId}:
    get:
      tags: [Cards]
      operationId: getCard
      summary: Get card details
      description: '**UC-01.** Used by the card screen and after any status change.'
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Card details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CardNotFound'

  /cards/{cardId}/block:
    post:
      tags: [Card Status]
      operationId: blockCardTemporarily
      summary: Temporarily block a card
      description: |
        **UC-02**, transition T1 `ACTIVE` → `TEMP_BLOCKED`.

        - No step-up authentication is required (BR-02-1).
        - The card is reported as blocked only after the processing center has
          confirmed the block (BR-02-2).
        - Repeating the request for a card that is already `TEMP_BLOCKED`
          returns `200` without changes (ext. 5b).
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Card is blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
              examples:
                blocked:
                  $ref: '#/components/examples/CardTempBlocked'
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '409':
          description: |
            The card status does not allow a temporary block:
            - `CARD_FRAUD_BLOCKED`: the card is blocked by the anti-fraud system (ext. 5c);
            - `CARD_STATUS_FINAL`: the card is `PERM_BLOCKED` or `CLOSED` (ext. 5d).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                fraudBlocked:
                  $ref: '#/components/examples/ProblemCardFraudBlocked'
                statusFinal:
                  $ref: '#/components/examples/ProblemCardStatusFinal'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /cards/{cardId}/unblock:
    post:
      tags: [Card Status]
      operationId: unblockCard
      summary: Unblock a temporarily blocked card
      description: |
        **UC-03**, transition T2 `TEMP_BLOCKED` → `ACTIVE`.

        - Requires a step-up token for action `UNBLOCK_CARD` (BR-03-1).
        - Repeating the request for a card that is already `ACTIVE` returns
          `200` without changes (ext. 5a).
        - If the processing center is unavailable, the request fails with
          `503` and is **not** retried in the background (BR-03-2). There is no
          `202` response for this operation.
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StepUpTokenRequired'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Card is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StepUpInvalid'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '409':
          description: |
            The card status does not allow unblocking:
            - `CARD_FRAUD_BLOCKED`: use the fraud case instead (ext. 5b);
            - `CARD_STATUS_FINAL`: the card is `PERM_BLOCKED` or `CLOSED` (ext. 5c).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                fraudBlocked:
                  $ref: '#/components/examples/ProblemCardFraudBlocked'
                statusFinal:
                  $ref: '#/components/examples/ProblemCardStatusFinal'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '503':
          $ref: '#/components/responses/ProcessingUnavailable'

  /cards/{cardId}/permanent-block:
    post:
      tags: [Card Status]
      operationId: blockCardPermanently
      summary: Permanently block a lost or stolen card
      description: |
        **UC-04**, transitions T6 `ACTIVE` → `PERM_BLOCKED` and
        T7 `TEMP_BLOCKED` → `PERM_BLOCKED`.

        - The block is irreversible (BR-04-1).
        - No step-up authentication is required (BR-04-2).
        - The reason `FRAUD_CONFIRMED` cannot be set here, only through
          `POST /fraud-cases/{caseId}/resolution` (BR-04-3).
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermanentBlockRequest'
            example:
              reason: LOST
      responses:
        '200':
          description: Card is permanently blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '409':
          description: |
            The card status does not allow a permanent block:
            - `CARD_FRAUD_BLOCKED`: answer "Not me" in the fraud case instead (ext. 7b);
            - `CARD_STATUS_FINAL`: the card is already `PERM_BLOCKED` or `CLOSED` (ext. 7a).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                fraudBlocked:
                  $ref: '#/components/examples/ProblemCardFraudBlocked'
                statusFinal:
                  $ref: '#/components/examples/ProblemCardStatusFinal'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /operations/{operationId}:
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Get the status of an asynchronous card operation
      description: |
        **UC-02 ext. 6a, UC-04 ext. 8a.** Polled by the app after a `202`
        response. Recommended polling interval: 2 seconds, then the app
        stops polling and refreshes the card when the customer reopens it.
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Operation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              examples:
                pending:
                  $ref: '#/components/examples/OperationPending'
                done:
                  $ref: '#/components/examples/OperationDone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cards/{cardId}/reissue-options:
    get:
      tags: [Reissue]
      operationId: getReissueOptions
      summary: Get delivery options for reissuing a card
      description: |
        **UC-05, steps 2-3.** Courier slots and branches are provided by the
        card production and delivery service. If courier delivery is not
        available at the customer's address, only branch pickup is returned
        (ext. 3a).
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Delivery options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReissueOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '409':
          $ref: '#/components/responses/ReissueNotAllowed'

  /cards/{cardId}/reissue:
    post:
      tags: [Reissue]
      operationId: reissueCard
      summary: Order a replacement card
      description: |
        **UC-05, steps 6-8.** Creates a reissue request and starts the reissue
        saga asynchronously. The response is returned without waiting for the
        processing center or the delivery service.

        - Only a `PERM_BLOCKED` card can be reissued (BR-05-1).
        - If an active reissue request already exists for the card, it is
          returned with `200` instead of creating a new one (BR-05-2, ext. 7d).
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReissueRequestCreate'
            examples:
              courier:
                summary: Courier delivery
                value:
                  delivery:
                    method: COURIER
                    slotId: 7f6c2a1e-6c1d-4a3e-9d0e-2b8c4e5f7a10
              branch:
                summary: Branch pickup
                value:
                  delivery:
                    method: BRANCH
                    branchId: MSK-014
      responses:
        '200':
          description: An active reissue request already exists for this card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReissueRequest'
        '202':
          description: Reissue request accepted; the saga runs asynchronously
          headers:
            Location:
              description: URL of the reissue request
              schema:
                type: string
              example: /reissue-requests/0b9e5d2c-3c8a-4f71-9a55-6d1f0e4b2c77
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReissueRequest'
              examples:
                created:
                  $ref: '#/components/examples/ReissueRequestCreated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '409':
          $ref: '#/components/responses/ReissueNotAllowed'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /reissue-requests/{requestId}:
    get:
      tags: [Reissue]
      operationId: getReissueRequest
      summary: Get the progress of a reissue request
      description: '**UC-05, step 9 and later.** Shows the saga progress to the customer.'
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Reissue request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReissueRequest'
              examples:
                completed:
                  $ref: '#/components/examples/ReissueRequestCompleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /fraud-cases/{caseId}:
    get:
      tags: [Fraud Cases]
      operationId: getFraudCase
      summary: Get a fraud case with suspicious transactions
      description: |
        **UC-07, steps 1-2.** The returned `version` must be sent back with the
        resolution, so that the answer applies to exactly the transactions the
        customer has seen (BR-07-4).
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Fraud case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudCase'
              examples:
                open:
                  $ref: '#/components/examples/FraudCaseOpen'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /fraud-cases/{caseId}/resolution:
    post:
      tags: [Fraud Cases]
      operationId: resolveFraudCase
      summary: Confirm or reject the suspicious transactions
      description: |
        **UC-07.**

        - `CONFIRMED` ("It was me"): transition T4 `FRAUD_BLOCKED` → `ACTIVE`.
          Requires a step-up token for action `CONFIRM_FRAUD_CASE` (BR-07-1).
          If the processing center is unavailable, the request fails with `503`
          and is not retried in the background (ext. 9a).
        - `REJECTED` ("Not me"): transition T5 `FRAUD_BLOCKED` → `PERM_BLOCKED`
          with reason `FRAUD_CONFIRMED`. No step-up token is required
          (BR-07-2). May return `202` if the processing center is unavailable
          (ext. 4a4a).
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StepUpTokenOptional'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FraudCaseResolution'
            examples:
              itWasMe:
                summary: It was me
                value:
                  decision: CONFIRMED
                  caseVersion: 1
              notMe:
                summary: Not me
                value:
                  decision: REJECTED
                  caseVersion: 1
      responses:
        '200':
          description: Fraud case resolved; the updated card is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StepUpInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The fraud case cannot be resolved with this request:
            - `FRAUD_CASE_CHANGED`: new transactions were added after the customer
              loaded the case; reload and review again (ext. 8b);
            - `FRAUD_CASE_CLOSED`: the case was already resolved, for example via
              the contact center (ext. 8c).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                changed:
                  $ref: '#/components/examples/ProblemFraudCaseChanged'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '503':
          $ref: '#/components/responses/ProcessingUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer access token issued at login.

  parameters:
    CardId:
      name: cardId
      in: path
      required: true
      description: Internal card ID. Never the card number.
      schema:
        type: string
        format: uuid
      example: 3f2b8c1e-9a4d-4e6b-8f21-5c7d0a9e1b44
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: a71c4e09-2d5b-4c8e-b3f6-90e1d2c4a8b5
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID generated by the app for each user action. Reused unchanged on
        retries of the same action.
      schema:
        type: string
        format: uuid
      example: 5d0e6a3b-1f8c-4b27-9e4d-7a2c1b0f9e63
    StepUpTokenRequired:
      name: X-Step-Up-Token
      in: header
      required: true
      description: Step-up token issued by the Auth Service for this card and action.
      schema:
        type: string
    StepUpTokenOptional:
      name: X-Step-Up-Token
      in: header
      required: false
      description: Required when `decision` is `CONFIRMED`; ignored when it is `REJECTED`.
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation ID for tracing; generated by the gateway if absent.
      schema:
        type: string
        format: uuid

  responses:
    OperationAccepted:
      description: |
        The processing center did not respond in time. The operation continues
        in the background; poll it at `GET /operations/{operationId}`. The card
        status has not changed yet.
      headers:
        Location:
          description: URL of the operation
          schema:
            type: string
          example: /operations/c4e1b7a2-8d3f-4a96-b2e0-1f5d6c9a7e38
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
          examples:
            pending:
              $ref: '#/components/examples/OperationPending'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StepUpInvalid:
      description: |
        Step-up token is missing, expired or issued for another card or action
        (`STEP_UP_REQUIRED`, `STEP_UP_INVALID`). The app must ask the customer
        to confirm again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.thebank.example/problems/step-up-required
            title: Additional confirmation required
            status: 403
            code: STEP_UP_REQUIRED
    CardNotFound:
      description: |
        The card does not exist or does not belong to the customer
        (`CARD_NOT_FOUND`). Both cases return the same response so as not to
        reveal whether the card exists (UC-02 ext. 5a).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.thebank.example/problems/card-not-found
            title: Card not found
            status: 404
            code: CARD_NOT_FOUND
    NotFound:
      description: Resource not found or does not belong to the customer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: The request body is invalid (`VALIDATION_ERROR`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.thebank.example/problems/validation-error
            title: Invalid request
            status: 400
            code: VALIDATION_ERROR
            detail: 'reason: must be one of LOST, STOLEN'
    IdempotencyKeyReused:
      description: |
        The idempotency key was already used for a different request (another
        card, endpoint or body) (`IDEMPOTENCY_KEY_REUSED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ReissueNotAllowed:
      description: |
        The card cannot be reissued:
        - `CARD_NOT_PERM_BLOCKED`: the card is `ACTIVE` or `TEMP_BLOCKED`; block it permanently first (ext. 7a);
        - `CARD_FRAUD_BLOCKED`: respond to the fraud case first (ext. 7b);
        - `CARD_ALREADY_REISSUED`: the card is `CLOSED` (ext. 7c).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProcessingUnavailable:
      description: |
        The processing center is unavailable and the operation is not retried
        in the background (`PROCESSING_UNAVAILABLE`). The card status has not
        changed; the customer can try again later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: The service is temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CardStatus:
      type: string
      description: See the card lifecycle for allowed transitions.
      enum: [ACTIVE, TEMP_BLOCKED, FRAUD_BLOCKED, PERM_BLOCKED, CLOSED]

    BlockReason:
      type: string
      nullable: true
      description: Empty for `ACTIVE` cards.
      enum: [CUSTOMER_REQUEST, FRAUD_SUSPECTED, LOST, STOLEN, FRAUD_CONFIRMED, null]

    CardAction:
      type: string
      enum: [BLOCK_TEMPORARILY, UNBLOCK, BLOCK_PERMANENTLY, REISSUE, REVIEW_FRAUD_CASE]

    Card:
      type: object
      required: [id, maskedPan, paymentSystem, expiry, status, availableActions]
      properties:
        id:
          type: string
          format: uuid
        maskedPan:
          type: string
          pattern: '^•••• \d{4}$'
          example: •••• 4417
        name:
          type: string
          description: Card name shown in the app
          example: Everyday card
        paymentSystem:
          type: string
          enum: [VISA, MASTERCARD, MIR]
        expiry:
          type: string
          pattern: '^(0[1-9]|1[0-2])/\d{2}$'
          example: 09/29
        status:
          $ref: '#/components/schemas/CardStatus'
        blockReason:
          $ref: '#/components/schemas/BlockReason'
        availableActions:
          type: array
          description: Calculated by the server from the card status (BR-01-3)
          items:
            $ref: '#/components/schemas/CardAction'
        pendingOperationId:
          type: string
          format: uuid
          nullable: true
          description: Set while a block operation is in progress (UC-01 ext. 3b)
        openFraudCaseId:
          type: string
          format: uuid
          nullable: true
          description: Set when the card is `FRAUD_BLOCKED` (UC-01 ext. 3c)
        reissueRequestId:
          type: string
          format: uuid
          nullable: true
          description: Active or completed reissue request for this card
        replacedByCardId:
          type: string
          format: uuid
          nullable: true
          description: For a `CLOSED` card, the card that replaced it
        closedAt:
          type: string
          format: date-time
          nullable: true

    PermanentBlockRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [LOST, STOLEN]

    Operation:
      type: object
      required: [id, type, status, cardId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [TEMP_BLOCK, PERMANENT_BLOCK]
        status:
          type: string
          description: |
            `PENDING`: retrying in the background; `DONE`: the card status has
            changed; `FAILED`: retries exhausted, the customer is advised to
            call the hotline.
          enum: [PENDING, DONE, FAILED]
        cardId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        card:
          allOf:
            - $ref: '#/components/schemas/Card'
          nullable: true
          description: The updated card, set when the status is `DONE`

    ReissueOptions:
      type: object
      required: [courierAvailable, branches]
      properties:
        courierAvailable:
          type: boolean
        deliveryAddress:
          type: string
          nullable: true
          description: Registered address, partially masked
          example: Moscow, Tverskaya st., bld. 1•, apt. ••
        courierSlots:
          type: array
          items:
            $ref: '#/components/schemas/CourierSlot'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'

    CourierSlot:
      type: object
      required: [id, date, timeFrom, timeTo]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        timeFrom:
          type: string
          example: '10:00'
        timeTo:
          type: string
          example: '14:00'

    Branch:
      type: object
      required: [id, name, address, readyDate]
      properties:
        id:
          type: string
          example: MSK-014
        name:
          type: string
        address:
          type: string
        readyDate:
          type: string
          format: date
          description: Estimated date the card is ready for pickup

    ReissueRequestCreate:
      type: object
      required: [delivery]
      properties:
        delivery:
          $ref: '#/components/schemas/DeliveryChoice'

    DeliveryChoice:
      type: object
      required: [method]
      description: '`slotId` is required for `COURIER`, `branchId` for `BRANCH`.'
      properties:
        method:
          type: string
          enum: [COURIER, BRANCH]
        slotId:
          type: string
          format: uuid
        branchId:
          type: string

    ReissueRequestStatus:
      type: string
      description: Current step of the reissue saga.
      enum:
        - CREATED
        - NEW_CARD_ISSUED
        - DELIVERY_ORDERED
        - OLD_CARD_CLOSED
        - COMPLETED
        - COMPENSATING
        - FAILED
        - MANUAL_HANDLING

    ReissueRequest:
      type: object
      required: [id, oldCardId, status, delivery, createdAt]
      properties:
        id:
          type: string
          format: uuid
        oldCardId:
          type: string
          format: uuid
        newCardId:
          type: string
          format: uuid
          nullable: true
          description: Set after saga step S1
        status:
          $ref: '#/components/schemas/ReissueRequestStatus'
        delivery:
          type: object
          required: [method]
          properties:
            method:
              type: string
              enum: [COURIER, BRANCH]
            estimatedDate:
              type: string
              format: date
              nullable: true
        failureReason:
          type: string
          nullable: true
          description: Customer-facing reason, set when the status is `FAILED`
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FraudCase:
      type: object
      required: [id, cardId, status, version, transactions, openedAt]
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        maskedPan:
          type: string
          example: •••• 4417
        status:
          type: string
          enum: [OPEN, CONFIRMED_BY_CUSTOMER, REJECTED_BY_CUSTOMER]
        version:
          type: integer
          minimum: 1
          description: Incremented every time a transaction is added to the case
        transactions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SuspiciousTransaction'
        openedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    SuspiciousTransaction:
      type: object
      required: [id, amount, currency, merchant, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: string
          description: Decimal amount as a string to avoid rounding errors
          example: '18990.00'
        currency:
          type: string
          description: ISO 4217 code
          example: RUB
        merchant:
          type: string
          example: ELECTRO-WORLD ONLINE
        country:
          type: string
          description: ISO 3166-1 alpha-2 code
          example: RU
        occurredAt:
          type: string
          format: date-time

    FraudCaseResolution:
      type: object
      required: [decision, caseVersion]
      properties:
        decision:
          type: string
          description: '`CONFIRMED` = "It was me", `REJECTED` = "Not me"'
          enum: [CONFIRMED, REJECTED]
        caseVersion:
          type: integer
          minimum: 1
          description: The fraud case version the customer has seen (BR-07-4)

    Problem:
      type: object
      description: RFC 7807 problem details with a machine-readable code
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - VALIDATION_ERROR
            - CARD_NOT_FOUND
            - NOT_FOUND
            - CARD_FRAUD_BLOCKED
            - CARD_STATUS_FINAL
            - CARD_NOT_PERM_BLOCKED
            - CARD_ALREADY_REISSUED
            - STEP_UP_REQUIRED
            - STEP_UP_INVALID
            - FRAUD_CASE_CHANGED
            - FRAUD_CASE_CLOSED
            - IDEMPOTENCY_KEY_REUSED
            - PROCESSING_UNAVAILABLE
            - SERVICE_UNAVAILABLE
            - RATE_LIMITED
        detail:
          type: string
        requestId:
          type: string
          format: uuid

